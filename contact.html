<form
  class="contact-form"
  action="https://formspree.io/f/YOUR_FORM_ID"
  method="POST"
>
  <label for="contact-name">Your Name</label>
  <input
    id="contact-name"
    type="text"
    name="name"
    placeholder="Enter your name"
    required
  >

  <label for="contact-email">Your Email</label>
  <input
    id="contact-email"
    type="email"
    name="email"
    placeholder="Enter your email address"
    required
  >

  <label for="contact-message">Your Message</label>
  <textarea
    id="contact-message"
    name="message"
    rows="5"
    maxlength="5000"
    placeholder="How can I help you?"
    required
  ></textarea>

  <button class="button" type="submit">
    Send Message ↗
  </button>
</form>
<!-- 3D Social Media Links -->
<div class="social-section">
  <h3>Connect With Me</h3>
  <p>Let's connect and build something great.</p>

  <div class="social-grid">

    <!-- WhatsApp -->
    <a
      class="social-card whatsapp"
      href="https://wa.me/YOURPHONENUMBER"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Connect with me on WhatsApp"
    >
      <span class="social-icon">
        <img src="https://cdn.simpleicons.org/whatsapp/25D366"
             alt="" width="38" height="38">
      </span>
      <span class="social-name">WhatsApp</span>
      <span class="social-action">Let's Chat ↗</span>
    </a>

    <!-- GitHub -->
    <a
      class="social-card github"
      href="https://github.com/YOURUSERNAME"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit my GitHub profile"
    >
      <span class="social-icon">
        <img src="https://cdn.simpleicons.org/github/ffffff"
             alt="" width="38" height="38">
      </span>
      <span class="social-name">GitHub</span>
      <span class="social-action">View Projects ↗</span>
    </a>

    <!-- LinkedIn -->
    <a
      class="social-card linkedin"
      href="https://www.linkedin.com/in/YOURUSERNAME/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit my LinkedIn profile"
    >
      <span class="social-icon">
        <img src="https://cdn.simpleicons.org/linkedin/0A66C2"
             alt="" width="38" height="38">
      </span>
      <span class="social-name">LinkedIn</span>
      <span class="social-action">Connect ↗</span>
    </a>

    <!-- Gmail -->
    <a
      class="social-card gmail"
      href="mailto:YOUR_EMAIL@example.com"
      aria-label="Send me an email"
    >
      <span class="social-icon">
        <img src="https://cdn.simpleicons.org/gmail/EA4335"
             alt="" width="38" height="38">
      </span>
      <span class="social-name">Gmail</span>
      <span class="social-action">Email Me ↗</span>
    </a>

  </div>
</div>
